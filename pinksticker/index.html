  <script type="text/babel" data-presets="react">
    const { useEffect, useMemo, useRef, useState } = React;

      ),

      ),

        <svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

        </svg>
      ),

    function blankForm() {
      return {
        stickerNo: '',
        vesselName: '',
        mooringNumber: '',
        reason: '',
        stickeredBy: '',
        initialNote: '',
        stickerPhotos: [],
        vesselPhotos: [],
        location: null,
      };
    }

    function toDateText(value) {
      if (!value) return '-';
      const d = new Date(value);
      return d.toLocaleString('en-NZ', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }


      function decimalToDegreeMinute(value, axis) {
        if (value == null || Number.isNaN(Number(value))) return '-';
        const numeric = Number(value);
        const direction = axis === 'lat'
          ? (numeric >= 0 ? 'N' : 'S')
          : (numeric >= 0 ? 'E' : 'W');
        const absolute = Math.abs(numeric);
        const degrees = Math.floor(absolute);
        const minutes = (absolute - degrees) * 60;
        return `${degrees}° ${minutes.toFixed(4)}' ${direction}`;
      }

      function parseDecimalCoordinate(value, axis) {
        const input = String(value ?? '').trim().toUpperCase();
        if (!input) return null;
        const directionMatch = input.match(/[NSEW]$/);
        const direction = directionMatch ? directionMatch[0] : '';
        const numeric = Number(input.replace(/[NSEW]/g, '').trim());
        if (!Number.isFinite(numeric)) return null;
        let result = numeric;
        if (direction === 'S' || direction === 'W') result = -Math.abs(result);
        if (direction === 'N' || direction === 'E') result = Math.abs(result);
        const limit = axis === 'lat' ? 90 : 180;
        return Math.abs(result) <= limit ? result : null;
      }

      function parseDegreeMinuteCoordinate(degreesValue, minutesValue, directionValue, axis) {
        const degrees = Number(String(degreesValue ?? '').trim());
        const minutes = Number(String(minutesValue ?? '').trim());
        const direction = String(directionValue ?? '').trim().toUpperCase();
        if (!Number.isFinite(degrees) || !Number.isFinite(minutes) || !direction) return null;
        if (minutes < 0 || minutes >= 60) return null;
        const limit = axis === 'lat' ? 90 : 180;
        if (Math.abs(degrees) > limit) return null;
        let result = Math.abs(degrees) + (minutes / 60);
        if (direction === 'S' || direction === 'W') result = -result;
        return Math.abs(result) <= limit ? result : null;
      }

      function buildLocationEditorState(location) {
        const lat = location?.latitude ?? '';
        const lng = location?.longitude ?? '';
        const latAbs = lat === '' ? '' : Math.abs(Number(lat));
        const lngAbs = lng === '' ? '' : Math.abs(Number(lng));
        const latDeg = lat === '' ? '' : Math.floor(latAbs);
        const lngDeg = lng === '' ? '' : Math.floor(lngAbs);
        return {
          mode: 'dm',
          latDecimal: lat === '' ? '' : Number(lat).toFixed(6),
          lngDecimal: lng === '' ? '' : Number(lng).toFixed(6),
          latDeg: lat === '' ? '' : String(latDeg),
          latMin: lat === '' ? '' : ((latAbs - latDeg) * 60).toFixed(4),
          latDir: lat === '' ? 'S' : (Number(lat) >= 0 ? 'N' : 'S'),
          lngDeg: lng === '' ? '' : String(lngDeg),
          lngMin: lng === '' ? '' : ((lngAbs - lngDeg) * 60).toFixed(4),
          lngDir: lng === '' ? 'E' : (Number(lng) >= 0 ? 'E' : 'W'),
        };
      }
      function hasValidCoordinates(item) {
        if (!item) return false;
        if (item.latitude === null || item.latitude === undefined || item.latitude === '') return false;
        if (item.longitude === null || item.longitude === undefined || item.longitude === '') return false;
        const latitude = Number(item.latitude);
        const longitude = Number(item.longitude);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return false;
        if (latitude < -90 || latitude > 90) return false;
        if (longitude < -180 || longitude > 180) return false;
        // Ignore blank legacy records that can become 0,0 after Number(null) conversion.
        if (latitude === 0 && longitude === 0) return false;
        return true;
      }
      function isActiveSticker(item) {
        return String(item?.status || '').trim().toLowerCase() === 'active';
      }

      function shouldShowMapPin(item) {
        return isActiveSticker(item) && hasValidCoordinates(item);
      }
      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        }[ch]));
      }

    function validatePinkStickerForm(form) {
      if (!form.stickerNo?.trim()) return 'Sticker No. is required.';
      if (!form.vesselName?.trim()) return 'Vessel name is required.';
      if (!form.reason?.trim()) return 'Reason is required.';
      if (!form.stickeredBy?.trim()) return 'Stickered by is required.';
      if (!form.stickerPhotos || form.stickerPhotos.length < 1) return 'At least 1 sticker photo is required.';
      if (!form.vesselPhotos || form.vesselPhotos.length < 1) return 'At least 1 vessel photo is required.';
      return null;
    }

    async function getCurrentLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Geolocation is not supported in this browser.'));
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            latitude: pos.coords.latitude,
            longitude: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
          }),
          (err) => reject(err),
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0,
          }
        );
      });
    }

    function normalizeFiles(fileList) {
      return Array.from(fileList || []).map((file) => ({
        file,
        previewUrl: URL.createObjectURL(file),
      }));
    }

    function buildPhotoPath(stickerNo, photoType, index, originalName) {
      const safeStickerNo = String(stickerNo || 'unknown').trim().replace(/[^a-zA-Z0-9-_]/g, '_');
      const ext = (originalName?.split('.').pop() || 'jpg').toLowerCase();
      return `${safeStickerNo}/${photoType}-${index}-${Date.now()}.${ext}`;
    }

    async function createPinkStickerRow(form) {
      const { data, error } = await sb
        .from('pink_sticker_records')
        .insert({
          sticker_no: form.stickerNo.trim(),
          vessel_name: form.vesselName.trim(),
          mooring_number: form.mooringNumber.trim() || null,
          reason: form.reason.trim(),
          stickered_by: form.stickeredBy.trim(),
          latitude: form.location?.latitude ?? null,
          longitude: form.location?.longitude ?? null,
          location_accuracy_m: form.location?.accuracy ?? null,
        })
        .select()
        .single();

      if (error) throw error;
      return data;
    }

    async function uploadPinkStickerPhoto(fileWrapper, stickerNo, photoType, index) {
      const path = buildPhotoPath(stickerNo, photoType, index, fileWrapper.file.name);
      const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, fileWrapper.file, {
        cacheControl: '3600',
        upsert: false,
        contentType: fileWrapper.file.type || 'image/jpeg',
      });
      if (error) throw error;
      return {
        storage_path: path,
        photo_type: photoType,
      };
    }

    async function insertPinkStickerPhotoRows(stickerId, photos) {
      if (!photos.length) return;
      const rows = photos.map((p) => ({
        pink_sticker_id: stickerId,
        photo_type: p.photo_type,
        storage_path: p.storage_path,
        public_url: null,
      }));
      const { error } = await sb.from('pink_sticker_photos').insert(rows);
      if (error) throw error;
    }

    async function insertInitialNote(stickerId, noteText, createdBy) {
      if (!noteText?.trim()) return;
      const { error } = await sb.from('pink_sticker_notes').insert({
        pink_sticker_id: stickerId,
        note_text: noteText.trim(),
        created_by: createdBy.trim(),
      });
      if (error) throw error;
    }

    async function fetchStickerByNumber(stickerNo) {
      const cleaned = stickerNo.trim();
      if (!cleaned) return null;
      const { data, error } = await sb
        .from('pink_sticker_records')
        .select('*')
        .eq('sticker_no', cleaned)
        .maybeSingle();
      if (error) throw error;
      return data;
    }

    async function fetchStickersByVesselName(vesselName) {
      const cleaned = vesselName.trim();
      if (!cleaned) return [];
      const { data, error } = await sb
        .from('pink_sticker_records')
        .select('*')
        .ilike('vessel_name', `%${cleaned}%`)
        .order('created_at', { ascending: false });
      if (error) throw error;
      return data || [];
    }

    async function fetchStickersByMooringNumber(mooringNumber) {
      const cleaned = mooringNumber.trim();
      if (!cleaned) return [];
      const { data, error } = await sb
        .from('pink_sticker_records')
        .select('*')
        .ilike('mooring_number', `%${cleaned}%`)
        .order('created_at', { ascending: false });
      if (error) throw error;
      return data || [];
    }

    async function fetchSmartSearchResults(searchText) {
      const cleaned = searchText.trim();
      if (!cleaned) return [];
      const [exactSticker, vesselMatches, mooringMatches] = await Promise.all([
        fetchStickerByNumber(cleaned),
        fetchStickersByVesselName(cleaned),
        fetchStickersByMooringNumber(cleaned),
      ]);
      const combined = [];
      const seenIds = new Set();
      [exactSticker, ...(vesselMatches || []), ...(mooringMatches || [])].forEach((item) => {
        if (item && !seenIds.has(item.id)) {
          seenIds.add(item.id);
          combined.push(item);
        }
      });
      return combined;
    }

    async function fetchAllStickers() {
      const { data, error } = await sb
        .from('pink_sticker_records')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      return data || [];
    }

    async function fetchStickerDetails(stickerId) {
      const [{ data: photos, error: photoError }, { data: notes, error: noteError }] = await Promise.all([
        sb.from('pink_sticker_photos').select('*').eq('pink_sticker_id', stickerId).order('created_at', { ascending: true }),
        sb.from('pink_sticker_notes').select('*').eq('pink_sticker_id', stickerId).order('created_at', { ascending: false }),
      ]);
      if (photoError) throw photoError;
      if (noteError) throw noteError;
      const photoRows = photos || [];
      const paths = photoRows.map((photo) => photo.storage_path).filter(Boolean);
      const signedByPath = {};
      if (paths.length) {
        const { data: signedRows, error: signedError } = await sb.storage
          .from(STORAGE_BUCKET)
          .createSignedUrls(paths, 3600);
        if (signedError) throw signedError;
        (signedRows || []).forEach((item) => {
          if (item.path && item.signedUrl) signedByPath[item.path] = item.signedUrl;
        });
      }
      const photosWithSignedUrls = photoRows.map((photo) => ({
        ...photo,
        signed_url: signedByPath[photo.storage_path] || '',
      }));
      return { photos: photosWithSignedUrls, notes: notes || [] };
    }

    async function addNote(stickerId, noteText, createdBy) {
      const { error } = await sb.from('pink_sticker_notes').insert({
        pink_sticker_id: stickerId,
        note_text: noteText.trim(),
        created_by: createdBy.trim(),
      });
      if (error) throw error;
    }

    async function markResolved(stickerId, resolvedBy) {
      const { error } = await sb
        .from('pink_sticker_records')
        .update({
          status: 'resolved',
          resolved_at: new Date().toISOString(),
          resolved_by: resolvedBy.trim(),
        })
        .eq('id', stickerId);
      if (error) throw error;
    }

    function App() {
      const [screen, setScreen] = useState('home');
      const [form, setForm] = useState(blankForm);
      const [isSaving, setIsSaving] = useState(false);
      const [isFetchingLocation, setIsFetchingLocation] = useState(false);
      const [isEditingLocation, setIsEditingLocation] = useState(false);
      const [locationEditor, setLocationEditor] = useState(buildLocationEditorState(null));
      const [isSearching, setIsSearching] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const [successMessage, setSuccessMessage] = useState('');
      const [searchType, setSearchType] = useState('sticker');
      const [searchStickerNo, setSearchStickerNo] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      const [allStickers, setAllStickers] = useState([]);
      const [isLoadingAllStickers, setIsLoadingAllStickers] = useState(false);
      const [selectedSticker, setSelectedSticker] = useState(null);
      const [selectedPhotos, setSelectedPhotos] = useState([]);
      const [selectedNotes, setSelectedNotes] = useState([]);
      const [noteInput, setNoteInput] = useState('');
      const [noteAuthor, setNoteAuthor] = useState('');
      const [resolvedBy, setResolvedBy] = useState('');
      const [isResolveModalOpen, setIsResolveModalOpen] = useState(false);
      const [additionalStickerPhotos, setAdditionalStickerPhotos] = useState([]);
      const [additionalVesselPhotos, setAdditionalVesselPhotos] = useState([]);
      const [isUploadingAdditionalPhotos, setIsUploadingAdditionalPhotos] = useState(false);
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const mapMarkerRef = useRef(null);
      const searchMapRef = useRef(null);
      const searchMapInstanceRef = useRef(null);
      const searchMarkersLayerRef = useRef(null);

      useEffect(() => {
        if (screen === 'new' && !form.location && !isFetchingLocation) {
          handleFetchLocation();
        }
      }, [screen]);

      useEffect(() => {
        if (screen === 'search' && allStickers.length === 0 && !isLoadingAllStickers) {
          loadAllStickers();
        }
      }, [screen, allStickers.length, isLoadingAllStickers]);

      useEffect(() => {
        return () => {
          // cleanup object URLs
          [...form.stickerPhotos, ...form.vesselPhotos].forEach((item) => {
            if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
          });
          [...additionalStickerPhotos, ...additionalVesselPhotos].forEach((item) => {
            if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
          });
        };
      }, []);

      function cleanupDetailMap() {
        if (mapInstanceRef.current) {
          mapInstanceRef.current.remove();
          mapInstanceRef.current = null;
        }
        mapMarkerRef.current = null;
      }

      useEffect(() => {
        if (screen !== 'detail' || !selectedSticker || !hasValidCoordinates(selectedSticker)) {
          cleanupDetailMap();
          return;
        }
        if (!mapRef.current || !window.L) return;

        const latitude = Number(selectedSticker.latitude);
        const longitude = Number(selectedSticker.longitude);
        if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
          cleanupDetailMap();
          return;
        }

        const latlng = [latitude, longitude];
        cleanupDetailMap();

        const map = L.map(mapRef.current, {
          zoomControl: true,
          attributionControl: true,
          preferCanvas: true,
        }).setView(latlng, 14);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          crossOrigin: true,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors',
        }).addTo(map);

        const seamarkLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
          maxZoom: 18,
          opacity: 0.9,
          crossOrigin: true,
          attribution: 'Seamarks &copy; OpenSeaMap',
        });

        seamarkLayer.on('tileerror', () => {
          if (map.hasLayer(seamarkLayer)) map.removeLayer(seamarkLayer);
        });
        seamarkLayer.addTo(map);

        mapMarkerRef.current = L.marker(latlng).addTo(map);
        mapInstanceRef.current = map;

        const refreshMapSize = () => map.invalidateSize({ pan: false });
        requestAnimationFrame(refreshMapSize);
        [150, 400, 900].forEach((delay) => setTimeout(refreshMapSize, delay));

        return cleanupDetailMap;
      }, [screen, selectedSticker?.id, selectedSticker?.latitude, selectedSticker?.longitude]);


      function cleanupSearchMap() {
        if (searchMapInstanceRef.current) {
          searchMapInstanceRef.current.remove();
          searchMapInstanceRef.current = null;
        }
        searchMarkersLayerRef.current = null;
      }

      useEffect(() => {
        if (screen !== 'search') {
          cleanupSearchMap();
          return;
        }
        if (!searchMapRef.current || !window.L) return;

        const stickersWithLocation = (allStickers || []).filter(shouldShowMapPin);

        cleanupSearchMap();

        const defaultCenter = [-36.8485, 174.7633];
        const map = L.map(searchMapRef.current, {
          zoomControl: true,
          attributionControl: true,
          preferCanvas: true,
        }).setView(defaultCenter, 11);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          crossOrigin: true,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors',
        }).addTo(map);

        const seamarkLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
          maxZoom: 18,
          opacity: 0.9,
          crossOrigin: true,
          attribution: 'Seamarks &copy; OpenSeaMap',
        });
        seamarkLayer.on('tileerror', () => {
          if (map.hasLayer(seamarkLayer)) map.removeLayer(seamarkLayer);
        });
        seamarkLayer.addTo(map);

        const markers = L.layerGroup().addTo(map);
        searchMarkersLayerRef.current = markers;

        const bounds = [];
        stickersWithLocation.forEach((item) => {
          if (!shouldShowMapPin(item)) return;
          const latitude = Number(item.latitude);
          const longitude = Number(item.longitude);
          const latlng = [latitude, longitude];
          bounds.push(latlng);
          const stickerLabel = item.sticker_no ? `Pink Sticker ${item.sticker_no}` : 'Pink Sticker';
          const vesselName = item.vessel_name?.trim() || '-';
          const mooringNumber = item.mooring_number?.trim() || '';
          const markerTitle = `${stickerLabel} - Vessel: ${vesselName}`;
          const subtitle = [vesselName !== '-' ? vesselName : '', mooringNumber].filter(Boolean).join(' - ');
          const safeStickerLabel = escapeHtml(stickerLabel);
          const safeVesselName = escapeHtml(vesselName);
          const safeSubtitle = escapeHtml(subtitle || 'No vessel/mooring details');
          const safeStatus = escapeHtml(item.status === 'resolved' ? 'Resolved' : 'Active');
          const marker = L.marker(latlng, { title: markerTitle }).addTo(markers);
          marker.bindTooltip(`<strong>${safeStickerLabel}</strong><br>Vessel: ${safeVesselName}`, {
            direction: 'top',
            offset: [0, -12],
            opacity: 0.95,
            sticky: true,
          });
          marker.bindPopup(`<strong>${safeStickerLabel}</strong><br>${safeSubtitle}<br><span>${safeStatus}</span>`);
          marker.on('click', () => openStickerDetail(item));
        });

        if (bounds.length) {
          map.fitBounds(bounds, { padding: [28, 28], maxZoom: 15 });
        }

        searchMapInstanceRef.current = map;
        const refreshMapSize = () => map.invalidateSize({ pan: false });
        requestAnimationFrame(refreshMapSize);
        [150, 400, 900].forEach((delay) => setTimeout(refreshMapSize, delay));

        return cleanupSearchMap;
      }, [screen, allStickers]);

      function resetMessages() {
        setErrorMessage('');
        setSuccessMessage('');
      }

      async function loadAllStickers() {
        setIsLoadingAllStickers(true);
        try {
          const rows = await fetchAllStickers();
          setAllStickers(rows);
        } catch (err) {
          console.error(err);
          setErrorMessage(err?.message || 'Failed to load pink sticker list.');
        } finally {
          setIsLoadingAllStickers(false);
        }
      }

      async function handleFetchLocation() {
        resetMessages();
        setIsFetchingLocation(true);
        try {
          const location = await getCurrentLocation();
          setForm((prev) => ({ ...prev, location }));
          setLocationEditor(buildLocationEditorState(location));
          setIsEditingLocation(false);
        } catch (err) {
          console.error(err);
          setErrorMessage('Unable to get current location. Please try again.');
        } finally {
          setIsFetchingLocation(false);
        }
      }

      function updateFormField(field, value) {
        setForm((prev) => ({ ...prev, [field]: value }));
      }


      function startLocationEdit() {
        resetMessages();
        setLocationEditor(buildLocationEditorState(form.location));
        setIsEditingLocation(true);
      }

      function cancelLocationEdit() {
        setLocationEditor(buildLocationEditorState(form.location));
        setIsEditingLocation(false);
      }

      function updateLocationEditorField(field, value) {
        setLocationEditor((prev) => ({ ...prev, [field]: value }));
      }

      function saveEditedLocation() {
        resetMessages();
        let latitude = null;
        let longitude = null;
        if (locationEditor.mode === 'decimal') {
          latitude = parseDecimalCoordinate(locationEditor.latDecimal, 'lat');
          longitude = parseDecimalCoordinate(locationEditor.lngDecimal, 'lng');
        } else {
          latitude = parseDegreeMinuteCoordinate(locationEditor.latDeg, locationEditor.latMin, locationEditor.latDir, 'lat');
          longitude = parseDegreeMinuteCoordinate(locationEditor.lngDeg, locationEditor.lngMin, locationEditor.lngDir, 'lng');
        }
        if (latitude == null || longitude == null) {
          setErrorMessage('Please enter a valid latitude and longitude.');
          return;
        }
        const location = { latitude, longitude, accuracy: form.location?.accuracy ?? 0 };
        setForm((prev) => ({ ...prev, location }));
        setLocationEditor(buildLocationEditorState(location));
        setIsEditingLocation(false);
      }
      function handleSelectStickerPhotos(e) {
        const nextFiles = normalizeFiles(e.target.files);
        setForm((prev) => ({ ...prev, stickerPhotos: [...(prev.stickerPhotos || []), ...nextFiles] }));
        e.target.value = '';
      }

      function handleSelectVesselPhotos(e) {
        const nextFiles = normalizeFiles(e.target.files);
        setForm((prev) => ({ ...prev, vesselPhotos: [...(prev.vesselPhotos || []), ...nextFiles] }));
        e.target.value = '';
      }

      function handleRemovePhoto(photoGroup, indexToRemove) {
        setForm((prev) => {
          const currentItems = prev[photoGroup] || [];
          const itemToRemove = currentItems[indexToRemove];
          if (itemToRemove?.previewUrl) URL.revokeObjectURL(itemToRemove.previewUrl);
          return {
            ...prev,
            [photoGroup]: currentItems.filter((_, idx) => idx !== indexToRemove),
          };
        });
      }

      function handleSelectAdditionalStickerPhotos(e) {
        const nextFiles = normalizeFiles(e.target.files);
        setAdditionalStickerPhotos((prev) => [...prev, ...nextFiles]);
        e.target.value = '';
      }

      function handleSelectAdditionalVesselPhotos(e) {
        const nextFiles = normalizeFiles(e.target.files);
        setAdditionalVesselPhotos((prev) => [...prev, ...nextFiles]);
        e.target.value = '';
      }

      function handleRemoveAdditionalPhoto(photoGroup, indexToRemove) {
        const setter = photoGroup === 'sticker' ? setAdditionalStickerPhotos : setAdditionalVesselPhotos;
        setter((prev) => {
          const itemToRemove = prev[indexToRemove];
          if (itemToRemove?.previewUrl) URL.revokeObjectURL(itemToRemove.previewUrl);
          return prev.filter((_, idx) => idx !== indexToRemove);
        });
      }

      function clearAdditionalPhotos() {
        [...additionalStickerPhotos, ...additionalVesselPhotos].forEach((item) => {
          if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        });
        setAdditionalStickerPhotos([]);
        setAdditionalVesselPhotos([]);
      }

      async function handleUploadAdditionalPhotos() {
        resetMessages();
        if (!selectedSticker) return;
        if (!additionalStickerPhotos.length && !additionalVesselPhotos.length) {
          setErrorMessage('Please select at least 1 photo to add.');
          return;
        }
        setIsUploadingAdditionalPhotos(true);
        try {
          const uploadedPhotos = [];
          const existingStickerCount = selectedPhotos.filter((p) => p.photo_type === 'sticker').length;
          const existingVesselCount = selectedPhotos.filter((p) => p.photo_type === 'vessel' || p.photo_type === 'legacy').length;
          for (let i = 0; i < additionalStickerPhotos.length; i++) {
            const uploaded = await uploadPinkStickerPhoto(additionalStickerPhotos[i], selectedSticker.sticker_no, 'sticker', existingStickerCount + i + 1);
            uploadedPhotos.push(uploaded);
          }
          for (let i = 0; i < additionalVesselPhotos.length; i++) {
            const uploaded = await uploadPinkStickerPhoto(additionalVesselPhotos[i], selectedSticker.sticker_no, 'vessel', existingVesselCount + i + 1);
            uploadedPhotos.push(uploaded);
          }
          await insertPinkStickerPhotoRows(selectedSticker.id, uploadedPhotos);
          clearAdditionalPhotos();
          await handleRefreshDetails(selectedSticker.id, selectedSticker.sticker_no);
          setSuccessMessage('Photo(s) added successfully.');
        } catch (err) {
          console.error(err);
          setErrorMessage(err?.message || 'Failed to add photo(s).');
        } finally {
          setIsUploadingAdditionalPhotos(false);
        }
      }

      async function handleSubmit() {
        resetMessages();
        const validationError = validatePinkStickerForm(form);
        if (validationError) {
          setErrorMessage(validationError);
          return;
        }

        if (!form.location) {
          setErrorMessage('Current location is required. Please retry location fetch.');
          return;
        }

        setIsSaving(true);
        try {
          

          const sticker = await createPinkStickerRow(form);
          const uploadedPhotos = [];

          for (let i = 0; i < form.stickerPhotos.length; i++) {
            const uploaded = await uploadPinkStickerPhoto(form.stickerPhotos[i], sticker.sticker_no, 'sticker', i + 1);
            uploadedPhotos.push(uploaded);
          }

          for (let i = 0; i < form.vesselPhotos.length; i++) {
            const uploaded = await uploadPinkStickerPhoto(form.vesselPhotos[i], sticker.sticker_no, 'vessel', i + 1);
            uploadedPhotos.push(uploaded);
          }

          await insertPinkStickerPhotoRows(sticker.id, uploadedPhotos);
          await insertInitialNote(sticker.id, form.initialNote, form.stickeredBy);

          setSuccessMessage(`Pink sticker ${sticker.sticker_no} saved successfully.`);
          setForm(blankForm());
          setScreen('home');
        } catch (err) {
          console.error(err);
          const msg = err?.message || 'Failed to save pink sticker.';
          if (String(msg).toLowerCase().includes('duplicate')) {
            setErrorMessage('Sticker No. already exists. Please use a unique number.');
          } else {
            setErrorMessage(msg);
          }
        } finally {
          setIsSaving(false);
        }
      }

      function focusSearchMapOnSticker(sticker) {
        const latitude = Number(sticker?.latitude);
        const longitude = Number(sticker?.longitude);
        if (!searchMapInstanceRef.current || !Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
        searchMapInstanceRef.current.flyTo([latitude, longitude], 17, { duration: 0.7 });
      }

      async function openStickerDetail(sticker) {
        // Keep the Search workspace visible and move its map to the selected pin.
        setSelectedSticker(sticker);
        focusSearchMapOnSticker(sticker);
        const details = await fetchStickerDetails(sticker.id);
        setSelectedSticker(sticker);
        setSelectedPhotos(details.photos);
        setSelectedNotes(details.notes);
        setResolvedBy('');
        setIsResolveModalOpen(false);
        setNoteInput('');
        setNoteAuthor('');
        setAdditionalStickerPhotos([]);
        setAdditionalVesselPhotos([]);
        setScreen('search');
        requestAnimationFrame(() => focusSearchMapOnSticker(sticker));
      }

      async function handleSearch() {
        resetMessages();
        const cleanedSearch = searchStickerNo.trim();
        if (!cleanedSearch) {
          setErrorMessage('Please enter a Sticker No., Vessel Name, or Mooring Number.');
          return;
        }
        setIsSearching(true);
        try {
          setSearchResults([]);
          const results = await fetchSmartSearchResults(cleanedSearch);
          if (!results.length) {
            setSelectedSticker(null);
            setSelectedPhotos([]);
            setSelectedNotes([]);
            setErrorMessage('No stickers found for that search.');
            return;
          }
          const exactStickerMatch = results.find((item) => String(item.sticker_no || '').trim().toLowerCase() === cleanedSearch.toLowerCase());
          if (exactStickerMatch) {
            await openStickerDetail(exactStickerMatch);
            return;
          }
          if (results.length === 1) {
            await openStickerDetail(results[0]);
            return;
          }
          setSearchResults(results);
        } catch (err) {
          console.error(err);
          setErrorMessage(err?.message || 'Failed to search sticker.');
        } finally {
          setIsSearching(false);
        }
      }

      async function handleRefreshDetails(stickerId, stickerNo) {
        const sticker = await fetchStickerByNumber(stickerNo);
        const details = await fetchStickerDetails(stickerId);
        setSelectedSticker(sticker);
        setSelectedPhotos(details.photos);
        setSelectedNotes(details.notes);
      }

      async function handleAddNote() {
        resetMessages();
        if (!selectedSticker) return;
        if (!noteInput.trim()) {
          setErrorMessage('Please enter a note.');
          return;
        }
        if (!noteAuthor.trim()) {
          setErrorMessage('Please enter the note author name.');
          return;
        }

        try {
          
          await addNote(selectedSticker.id, noteInput, noteAuthor);
          setNoteInput('');
          await handleRefreshDetails(selectedSticker.id, selectedSticker.sticker_no);
          setSuccessMessage('Note added successfully.');
        } catch (err) {
          console.error(err);
          setErrorMessage(err?.message || 'Failed to add note.');
        }
      }

      async function handleResolve() {
        resetMessages();
        if (!selectedSticker) return;
        if (!resolvedBy.trim()) {
          setErrorMessage('Please enter who resolved this sticker.');
          return;
        }

        try {
          
          await markResolved(selectedSticker.id, resolvedBy);
          await handleRefreshDetails(selectedSticker.id, selectedSticker.sticker_no);
          setIsResolveModalOpen(false);
          setResolvedBy('');
          setSuccessMessage('Sticker marked as resolved.');
        } catch (err) {
          console.error(err);
          setErrorMessage(err?.message || 'Failed to mark as resolved.');
        }
      }

      function renderMessageBar() {
        if (!errorMessage && !successMessage) return null;
        return (
          <div className="fixed bottom-4 left-4 right-4 z-50 pointer-events-none">
            {errorMessage && (
              <div className="pointer-events-auto bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl shadow-lg mb-2">
                {errorMessage}
              </div>
            )}
            {successMessage && (
              <div className="pointer-events-auto bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-2xl shadow-lg">
                {successMessage}
              </div>
            )}
          </div>
        );
      }

      function renderHeader() {
        return (
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-sm border-b border-gray-200">
            <div className="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
              <div>
                <div className="text-lg font-bold text-gray-900">Pink Sticker Registry</div>
                <div className="text-xs text-gray-500"></div>
              </div>
              <div className="flex items-center gap-2">
                {screen === 'detail' && (
                  <button
                    type="button"
                    onClick={() => {
                      resetMessages();
                      setScreen('search');
                    }}
                    className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-sm font-semibold"
                  >
                    ← Back
                  </button>
                )}
                <button
                  type="button"
                  onClick={() => {
                    resetMessages();
                    setSearchStickerNo('');
                    setSearchResults([]);
                    setScreen('home');
                  }}
                  className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-sm font-semibold"
                >
                  <Icons.Home className="w-4 h-4" /> Home
                </button>
              </div>
            </div>
          </header>
        );
      }

      function PhotoPickerCard({ title, description, items, onChange, photoGroup }) {
        return (
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 space-y-3">
            <div>
              <div className="text-base font-semibold text-gray-900">{title}</div>
              <div className="text-sm text-gray-500">{description}</div>
            </div>

                </div>
                <div>
                  <div className="text-gray-500">Resolved at</div>
                  <div className="font-semibold text-gray-900">{toDateText(selectedSticker.resolved_at)}</div>
                </div>
                <div>
                  <div className="text-gray-500">Resolved by</div>
                  <div className="font-semibold text-gray-900">{selectedSticker.resolved_by || '-'}</div>
                </div>
              </div>
            </div>

            <div className="detail-photos bg-white rounded-3xl border border-gray-200 shadow-sm p-6 space-y-4">
              <h3 className="text-lg font-bold">Photos</h3>
              <div>
                <div className="text-sm font-semibold mb-2">Sticker Photos</div>
                {stickerPhotos.length ? (
                  <div className="flex gap-3 overflow-x-auto thumb-scroll pb-1">
                    {stickerPhotos.map((photo) => (
                      <a key={photo.id} href={photo.signed_url} target="_blank" rel="noreferrer">
                        <img src={photo.signed_url} alt="Sticker" className="h-28 w-28 rounded-xl object-cover border border-gray-200 shrink-0" />
                      </a>
                    ))}
                  </div>
                ) : <div className="text-sm text-gray-500">No sticker photos found.</div>}
              </div>
              <div>
                <div className="text-sm font-semibold mb-2">Vessel Photos</div>
                {vesselPhotos.length ? (
                  <div className="flex gap-3 overflow-x-auto thumb-scroll pb-1">
                    {vesselPhotos.map((photo) => (
                      <a key={photo.id} href={photo.signed_url} target="_blank" rel="noreferrer">
                        <img src={photo.signed_url} alt="Vessel" className="h-28 w-28 rounded-xl object-cover border border-gray-200 shrink-0" />
                      </a>
                    ))}
                  </div>
                ) : <div className="text-sm text-gray-500">No vessel photos found.</div>}
              </div>
              <div className="border-t border-gray-100 pt-4 space-y-3">
                <div>
                  <div className="text-sm font-semibold text-gray-900">Add more photos</div>
                  <div className="text-xs text-gray-500">Add extra sticker or vessel photos to this existing pink sticker record.</div>
                </div>
                <div className="grid gap-3 sm:grid-cols-2">
                  <label className="block rounded-2xl border-2 border-dashed border-pink-200 bg-pink-50 hover:bg-pink-100 transition p-4 cursor-pointer text-center">
                    <div className="flex flex-col items-center gap-2 text-pink-700">
                      <Icons.Camera className="w-6 h-6" />
                      <div className="font-semibold">Add sticker photo</div>
                      <div className="text-xs text-pink-600">Camera or album - multiple allowed</div>
                    </div>
                    <input className="camera-input hidden" type="file" accept="image/*" multiple onChange={handleSelectAdditionalStickerPhotos} />
                  </label>
                  <label className="block rounded-2xl border-2 border-dashed border-gray-200 bg-gray-50 hover:bg-gray-100 transition p-4 cursor-pointer text-center">
                    <div className="flex flex-col items-center gap-2 text-gray-700">
                      <Icons.Camera className="w-6 h-6" />
                      <div className="font-semibold">Add vessel photo</div>
                      <div className="text-xs text-gray-500">Camera or album - multiple allowed</div>
                    </div>
                    <input className="camera-input hidden" type="file" accept="image/*" multiple onChange={handleSelectAdditionalVesselPhotos} />
                  </label>
                </div>
                {(additionalStickerPhotos.length > 0 || additionalVesselPhotos.length > 0) && (
                  <div className="space-y-3 rounded-2xl border border-gray-100 bg-gray-50 p-3">
                    {additionalStickerPhotos.length > 0 && (
                      <div>
                        <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-gray-500">New sticker photos</div>
                        <div className="flex gap-3 overflow-x-auto thumb-scroll pb-1">
                          {additionalStickerPhotos.map((item, idx) => (
                            <div key={idx} className="relative shrink-0">
                              <img src={item.previewUrl} alt={`New sticker photo ${idx + 1}`} className="h-24 w-24 rounded-xl object-cover border border-gray-200" />
                              <button type="button" onClick={() => handleRemoveAdditionalPhoto('sticker', idx)} className="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full bg-red-600 text-white shadow-md" aria-label={`Remove new sticker photo ${idx + 1}`}>×</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    {additionalVesselPhotos.length > 0 && (
                      <div>
                        <div className="mb-2 text-xs font-semibold uppercase tracking-wide text-gray-500">New vessel photos</div>
                        <div className="flex gap-3 overflow-x-auto thumb-scroll pb-1">
                          {additionalVesselPhotos.map((item, idx) => (
                            <div key={idx} className="relative shrink-0">
                              <img src={item.previewUrl} alt={`New vessel photo ${idx + 1}`} className="h-24 w-24 rounded-xl object-cover border border-gray-200" />
                              <button type="button" onClick={() => handleRemoveAdditionalPhoto('vessel', idx)} className="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full bg-red-600 text-white shadow-md" aria-label={`Remove new vessel photo ${idx + 1}`}>×</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    <div className="grid gap-2 sm:grid-cols-2">
                      <button type="button" onClick={handleUploadAdditionalPhotos} disabled={isUploadingAdditionalPhotos} className="h-11 rounded-2xl bg-pink-600 text-white font-semibold hover:bg-pink-700 disabled:bg-gray-300">
                        {isUploadingAdditionalPhotos ? 'Uploading...' : 'Save Added Photos'}
                      </button>
                      <button type="button" onClick={clearAdditionalPhotos} disabled={isUploadingAdditionalPhotos} className="h-11 rounded-2xl bg-white border border-gray-200 text-gray-700 font-semibold hover:bg-gray-50 disabled:bg-gray-100">
                        Cancel selected photos
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            <div className="detail-location bg-white rounded-3xl border border-gray-200 shadow-sm p-6 space-y-4">
              <h3 className="text-lg font-bold">Location</h3>
              {hasValidCoordinates(selectedSticker) ? (
                <div id="detail-map" ref={mapRef}></div>
              ) : (
                <div className="text-sm text-gray-500">No location available.</div>
              )}
            </div>

            <div className="detail-notes bg-white rounded-3xl border border-gray-200 shadow-sm p-6 space-y-4">
              <div className="flex items-center gap-2">
                <Icons.Note className="w-5 h-5 text-gray-700" />
                <h3 className="text-lg font-bold">Notes</h3>
              </div>

              <div className="space-y-3">
                {selectedNotes.length ? selectedNotes.map((note) => (
                  <div key={note.id} className="rounded-2xl border border-gray-200 p-3 bg-gray-50">
                    <div className="text-xs text-gray-500 mb-1 flex items-center gap-1">
                      <Icons.Clock className="w-3 h-3" />
                      {toDateText(note.created_at)} · {note.created_by}
                    </div>
                    <div className="text-sm text-gray-800">{note.note_text}</div>
                  </div>
                )) : (
                  <div className="text-sm text-gray-500">No notes yet.</div>
                )}
              </div>

              <div className="grid gap-3 md:grid-cols-[1fr_auto]">
                <input
                  type="text"
                  value={noteInput}
                  onChange={(e) => setNoteInput(e.target.value)}
                  placeholder="Add a note"
                  className="h-11 rounded-xl border border-gray-300 px-3 outline-none focus:ring-2 focus:ring-pink-500"
                />
                <input
                  type="text"
                  value={noteAuthor}
                  onChange={(e) => setNoteAuthor(e.target.value)}
                  placeholder="Note author"
                  className="h-11 rounded-xl border border-gray-300 px-3 outline-none focus:ring-2 focus:ring-pink-500"
                />
              </div>

              <button
                type="button"
                onClick={handleAddNote}
                className="w-full h-11 rounded-2xl bg-gray-900 text-white font-semibold hover:bg-black"
              >
                Add Note
              </button>
            </div>

            {isResolveModalOpen && selectedSticker.status !== 'resolved' && (
              <div
                className="resolve-modal-backdrop fixed inset-0 z-[100] flex items-center justify-center p-4"
                role="dialog"
                aria-modal="true"
                aria-labelledby="resolve-dialog-title"
                onMouseDown={(e) => {
                  if (e.target === e.currentTarget) {
                    setResolvedBy('');
                    setIsResolveModalOpen(false);
                  }
                }}
              >
                <div className="w-full max-w-md rounded-3xl border border-gray-200 bg-white p-6 shadow-lg">
                  <div className="mb-5 flex items-start justify-between gap-4">
                    <div>
                      <h3 id="resolve-dialog-title" className="text-xl font-bold text-gray-900">Resolve Sticker</h3>
                      <p className="mt-1 text-sm text-gray-500">Who resolved this pink sticker?</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        setResolvedBy('');
                        setIsResolveModalOpen(false);
                      }}
                      className="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200"
                      aria-label="Close resolve dialog"
                    >
                      <Icons.X className="h-4 w-4" />
                    </button>
                  </div>
                  <label className="mb-1 block text-sm font-semibold text-gray-900">Resolved by</label>
                  <input
                    type="text"
                    value={resolvedBy}
                    onChange={(e) => setResolvedBy(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') handleResolve();
                      if (e.key === 'Escape') {
                        setResolvedBy('');
                        setIsResolveModalOpen(false);
                      }
                    }}
                    autoFocus
                    placeholder="Enter name"
                    className="w-full h-11 rounded-xl border border-gray-300 px-3 outline-none focus:ring-2 focus:ring-green-500"
                  />
                  <div className="mt-5 grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => {
                        setResolvedBy('');
                        setIsResolveModalOpen(false);
                      }}
                      className="h-11 rounded-2xl border border-gray-200 bg-white text-gray-700 font-semibold hover:bg-gray-50"
                    >
                      Close
                    </button>
                    <button
                      type="button"
                      onClick={handleResolve}
                      className="h-11 rounded-2xl bg-green-600 text-white font-semibold hover:bg-green-700"
                    >
                      Save
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const content = useMemo(() => {
        if (screen === 'new') return renderNew();
        if (screen === 'search') return renderSearch();
        if (screen === 'detail') return renderDetail();
        return renderHome();
      }, [screen, form, isSaving, isFetchingLocation, searchType, searchStickerNo, searchResults, allStickers, isLoadingAllStickers, isSearching, selectedSticker, selectedPhotos, selectedNotes, noteInput, noteAuthor, resolvedBy, isResolveModalOpen, additionalStickerPhotos, additionalVesselPhotos, isUploadingAdditionalPhotos, isEditingLocation, locationEditor]);

      return (
        <div className="min-h-screen bg-gray-50">
          {renderHeader()}
          <main className={(screen === 'search' || screen === 'detail') ? "max-w-7xl mx-auto px-4 py-5 pb-24" : "max-w-3xl mx-auto px-4 py-5 pb-24"}>
            {content}
          </main>
          {renderMessageBar()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
