    function imagePath(value) {
      if (!value) return null;
      if (!/^https?:/i.test(value)) return String(value).replace(/^\/+/, '');
      for (const bucket of [IMAGE_BUCKET, LEGACY_IMAGE_BUCKET]) {
        for (const kind of ['public', 'sign']) {
          const marker = `/storage/v1/object/${kind}/${bucket}/`;
          const i = value.indexOf(marker);
          if (i >= 0) {
            const tail = value.slice(i + marker.length).split('?')[0].split('#')[0];
            try { return decodeURIComponent(tail); } catch (_) { return tail; }
          }
        }
      }
      return null;
    }
    function normalizeMarkers(input) {
      if (!Array.isArray(input)) return [];
      return input.map((m) => ({
        ...m,
        latestImage: imagePath(m.latestImage),
        history: (Array.isArray(m.history) ? m.history : []).map(e => ({...e, image:imagePath(e.image)})),
      }));
    }
    function absoluteSupabaseUrl(value) {
      if (!value) return null;
      if (/^https?:/i.test(value)) return value;
      return `${SUPABASE_URL}${value.startsWith('/') ? '' : '/'}${value}`;
    }
    async function signMarkers(input) {
      const persistent = normalizeMarkers(input);
      const paths = [...new Set(persistent.flatMap(m => [m.latestImage, ...(m.history||[]).map(e=>e.image)].filter(Boolean)))];
      if (!paths.length) return persistent;
      const pairs = await Promise.all(paths.map(async (path) => {
        const { data, error } = await sb.storage.from(IMAGE_BUCKET).createSignedUrl(path, IMAGE_TTL);
        if (error) {
          console.warn('Could not sign HM Sign image:', path, error);
          return [path, null];
        }
        return [path, absoluteSupabaseUrl(data?.signedUrl)];
      }));
      const urls = Object.fromEntries(pairs);
      return persistent.map(m => ({
        ...m,
        latestImage: m.latestImage ? (urls[m.latestImage] || null) : null,
        history: (m.history || []).map(e => ({ ...e, image: e.image ? (urls[e.image] || null) : null })),
      }));
    }

    function MainApp() {
      const [markers, setMarkers] = useState([]);
      const [selectedLocation, setSelectedLocation] = useState(null);
      const [isAddingMode, setIsAddingMode] = useState(false);
      const [tempCoords, setTempCoords] = useState(null);
      const [comment, setComment] = useState('');
      const [selectedImage, setSelectedImage] = useState(null);
      const [selectedFile, setSelectedFile] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [importText, setImportText] = useState('');
      const [copySuccess, setCopySuccess] = useState(false);
      const [syncMessage, setSyncMessage] = useState('Loading...');

      const [myLocation, setMyLocation] = useState(null);
      const [locationError, setLocationError] = useState('');
      const [isLocating, setIsLocating] = useState(false);

      const [lightboxImage, setLightboxImage] = useState(null);
      const [lightboxCaption, setLightboxCaption] = useState('');
      const [lightboxDate, setLightboxDate] = useState('');
      const [lightboxZoom, setLightboxZoom] = useState(1);
      const [lightboxOffset, setLightboxOffset] = useState({ x: 0, y: 0 });

      const [showPanel, setShowPanel] = useState(false);
      const [draftState, setDraftState] = useState(null);

      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const markersLayerRef = useRef(null);
      const tempMarkerRef = useRef(null);

      const myLocationMarkerRef = useRef(null);
      const myAccuracyCircleRef = useRef(null);
      const locationWatchIdRef = useRef(null);
      const centerOnNextLocationRef = useRef(false);
      const lightboxDragStartRef = useRef(null);
      const lightboxPointerIdRef = useRef(null);
      const previewUrlRef = useRef(null);

      function resetLightboxTransform() {
        setLightboxZoom(1);
        setLightboxOffset({ x: 0, y: 0 });
        lightboxDragStartRef.current = null;
        lightboxPointerIdRef.current = null;
      }

      function openLightbox(imageUrl, caption = '', dateText = '') {
        if (!imageUrl) return;
        setLightboxImage(imageUrl);
        setLightboxCaption(caption || '');
        setLightboxDate(dateText || '');
        resetLightboxTransform();
      }

      function closeLightbox() {
        setLightboxImage(null);
        setLightboxCaption('');
        setLightboxDate('');
        resetLightboxTransform();
      }

      function zoomLightboxBy(delta) {
        setLightboxZoom((prev) => {
          const next = Math.max(1, Math.min(4, Number((prev + delta).toFixed(2))));
          if (next === 1) {
            setLightboxOffset({ x: 0, y: 0 });
          }
          return next;
        });
      }

      function toggleLightboxZoom() {
        setLightboxZoom((prev) => {
          const next = prev > 1 ? 1 : 2;
          if (next === 1) {
            setLightboxOffset({ x: 0, y: 0 });
          }
          return next;
        });
      }

      function handleLightboxWheel(e) {
        e.preventDefault();
        zoomLightboxBy(e.deltaY < 0 ? 0.25 : -0.25);
      }

      function handleLightboxPointerDown(e) {
        if (lightboxZoom <= 1) return;
        e.preventDefault();
        lightboxPointerIdRef.current = e.pointerId;
        lightboxDragStartRef.current = {
          x: e.clientX - lightboxOffset.x,
          y: e.clientY - lightboxOffset.y,
        };
        e.currentTarget.setPointerCapture?.(e.pointerId);
      }

      function handleLightboxPointerMove(e) {
        if (lightboxZoom <= 1) return;
        if (lightboxPointerIdRef.current !== e.pointerId || !lightboxDragStartRef.current) return;
        e.preventDefault();
        setLightboxOffset({
          x: e.clientX - lightboxDragStartRef.current.x,
          y: e.clientY - lightboxDragStartRef.current.y,
        });
      }

      function handleLightboxPointerUp(e) {
        if (lightboxPointerIdRef.current !== e.pointerId) return;
        lightboxPointerIdRef.current = null;
        lightboxDragStartRef.current = null;
        e.currentTarget.releasePointerCapture?.(e.pointerId);
      }

      function clearComposer(options = {}) {
        const { revokePreview = false } = options;

        if (revokePreview && selectedImage && selectedImage.startsWith('blob:')) {
          URL.revokeObjectURL(selectedImage);
          if (previewUrlRef.current === selectedImage) {
            previewUrlRef.current = null;
          }
        }

        setIsAddingMode(false);
        setTempCoords(null);
        setComment('');
        setSelectedImage(null);
        setSelectedFile(null);
      }

      function hasUnsavedDraft() {
        return !!(tempCoords || comment || selectedImage || selectedFile);
      }

      function stashCurrentDraft() {
        if (!hasUnsavedDraft()) return false;
        setDraftState({
          tempCoords,
          comment,
          selectedImage,
          selectedFile,
        });
        return true;
      }

      function restoreDraft() {
        if (!draftState) return;
        setSelectedLocation(null);
        setTempCoords(draftState.tempCoords || null);
        setComment(draftState.comment || '');
        setSelectedImage(draftState.selectedImage || null);
        setSelectedFile(draftState.selectedFile || null);
        setIsAddingMode(true);
        setShowPanel(true);
        setDraftState(null);
      }

      function handleBackToMap() {
        if (isAddingMode) {
          stashCurrentDraft();
          clearComposer();
        }
        setShowPanel(false);
      }

      function handleClosePanel() {
        setSelectedLocation(null);
        setShowPanel(false);
        clearComposer({ revokePreview: true });
      }

      function openPinPanel(markerData) {
        if (hasUnsavedDraft()) {
          stashCurrentDraft();
          clearComposer();
        }
        setSelectedLocation(markerData);
        setShowPanel(true);
      }

      useEffect(() => {
        function onKeyDown(e) {
          if (e.key === 'Escape') {
            closeLightbox();
          } else if ((e.key === '+' || e.key === '=') && lightboxImage) {
            e.preventDefault();
            zoomLightboxBy(0.25);
          } else if (e.key === '-' && lightboxImage) {
            e.preventDefault();
            zoomLightboxBy(-0.25);
          } else if ((e.key === '0' || e.key.toLowerCase() === 'r') && lightboxImage) {
            e.preventDefault();
            resetLightboxTransform();
          }
        }
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [lightboxImage, lightboxZoom, lightboxOffset]);

      useEffect(() => {
        return () => {
          if (previewUrlRef.current) {
            URL.revokeObjectURL(previewUrlRef.current);
          }
        };
      }, []);

      async function saveSharedData(nextMarkers) {
        const normalized = normalizeMarkers(nextMarkers);
        localStorage.setItem(CACHE_KEY, JSON.stringify(normalized));
        setSyncMessage('Saving...');

        const { error } = await sb
          .from('app_state')
          .upsert({
            id: APP_STATE_ID,
            data: normalized,
            updated_at: new Date().toISOString(),
          });

        if (error) {
          console.error('Failed to save shared data:', error);
          setSyncMessage('Save failed (local backup only)');
          return false;
        }

        setSyncMessage('Synced');
        return true;
      }

      async function uploadImageToStorage(file) {
        if (!file) return null;

        const ext = file.name?.split('.').pop()?.toLowerCase() || 'jpg';
        const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
        const filePath = `pins/${fileName}`;

        const { error } = await sb.storage.from(IMAGE_BUCKET).upload(filePath, file, {
          cacheControl: '3600',
          upsert: false,
          contentType: file.type || 'image/jpeg',
        });

        if (error) {
          console.error('Failed to upload image:', error);
          alert('Image upload failed: ' + error.message);
          return null;
        }

        return filePath;
      }

      function extractStoragePathFromUrl(url) { return imagePath(url); }

      function rebuildMarkerAfterHistoryChange(marker, nextHistory) {
        const history = Array.isArray(nextHistory) ? nextHistory : [];
        const lastWithImage = [...history].reverse().find((entry) => entry.image);
        const lastWithComment = [...history].reverse().find((entry) => entry.comment);

        return {
          ...marker,
          history,
          latestImage: lastWithImage?.image || null,
          latestComment: lastWithComment?.comment || '',
          updatedAt:
            history.length > 0
              ? history[history.length - 1].timestamp
              : marker.updatedAt || marker.createdAt || new Date().toISOString(),
        };
      }

      function getLocationErrorMessage(error) {
        switch (error.code) {
          case 1:
            return 'Location access was denied. Please allow location permission in your browser or device settings.';
          case 2:
            return 'Current location is unavailable.';
          case 3:
            return 'Location request timed out. Please try again.';
          default:
            return 'Unable to get your location.';
        }
      }

      function updateMyLocation(position) {
        const { latitude, longitude, accuracy } = position.coords;
        const latlng = [latitude, longitude];

        setMyLocation({ lat: latitude, lng: longitude, accuracy });
        setLocationError('');
        setIsLocating(false);

        if (!mapInstanceRef.current) return;

        if (!myLocationMarkerRef.current) {
          const userIcon = L.divIcon({
            className: 'custom-pin',
            html: `
              <div style="position:relative;width:18px;height:18px;">
                <div style="position:absolute;inset:-6px;background:rgba(59,130,246,0.22);border-radius:9999px;"></div>
                <div style="position:absolute;inset:0;background:#2563eb;border:3px solid #ffffff;border-radius:9999px;box-shadow:0 2px 8px rgba(0,0,0,0.25);"></div>
              </div>
            `,
            iconSize: [18, 18],
            iconAnchor: [9, 9],
          });

          myLocationMarkerRef.current = L.marker(latlng, {
            icon: userIcon,
            interactive: false,
            keyboard: false,
          }).addTo(mapInstanceRef.current);
        } else {
          myLocationMarkerRef.current.setLatLng(latlng);
        }

        if (!myAccuracyCircleRef.current) {
          myAccuracyCircleRef.current = L.circle(latlng, {
            radius: accuracy || 0,
            color: '#2563eb',
            weight: 1,
            fillColor: '#60a5fa',
            fillOpacity: 0.12,
            interactive: false,
          }).addTo(mapInstanceRef.current);
        } else {
          myAccuracyCircleRef.current.setLatLng(latlng);
          myAccuracyCircleRef.current.setRadius(accuracy || 0);
        }

        if (centerOnNextLocationRef.current) {
          const nextZoom = Math.max(mapInstanceRef.current.getZoom(), 16);
          mapInstanceRef.current.setView(latlng, nextZoom);
          centerOnNextLocationRef.current = false;
        }
      }

      function handleLocationError(error) {
        console.error('Location error:', error);
        setIsLocating(false);
        setLocationError(getLocationErrorMessage(error));
        centerOnNextLocationRef.current = false;
      }

      function handleLocateMe() {
        if (!navigator.geolocation) {
          setLocationError('This browser does not support geolocation.');
          return;
        }

        setIsLocating(true);
        setLocationError('');
        centerOnNextLocationRef.current = true;

        const options = {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0,
        };

        navigator.geolocation.getCurrentPosition(updateMyLocation, handleLocationError, options);

        if (locationWatchIdRef.current == null) {
          locationWatchIdRef.current = navigator.geolocation.watchPosition(
            updateMyLocation,
            handleLocationError,
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
          );
        }
      }

      useEffect(() => {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          try {
            setMarkers([]);
          } catch (e) {
            console.error('Failed to parse cached data:', e);
          }
        }

        async function loadSharedData() {
          setSyncMessage('Loading from Supabase...');
          const { data, error } = await sb
            .from('app_state')
            .select('data')
            .eq('id', APP_STATE_ID)
            .limit(1);

          if (error) {
            console.error('Failed to load shared data:', error);
            setSyncMessage('Remote load failed (using local cache)');
            return;
          }

          const persistentMarkers = data && data.length > 0 ? normalizeMarkers(data[0].data) : [];
          const remoteMarkers = await signMarkers(persistentMarkers);
          setMarkers(remoteMarkers);
          localStorage.setItem(CACHE_KEY, JSON.stringify(persistentMarkers));
          setSyncMessage('Load complete');
        }

        loadSharedData();
      }, []);

      useEffect(() => {
        if (!mapInstanceRef.current && mapRef.current) {
          const map = L.map(mapRef.current, { zoomControl: false }).setView([-36.8485, 174.7633], 13);

          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri, Maxar, Earthstar Geographics, and the GIS User Community',
            maxZoom: 19,
            maxNativeZoom: 19,
          }).addTo(map);

          markersLayerRef.current = L.layerGroup().addTo(map);
          mapInstanceRef.current = map;

          map.on('click', (e) => handleMapClick(e.latlng));
        }
      }, []);

      useEffect(() => {
        if (!mapInstanceRef.current || !markersLayerRef.current) return;

        markersLayerRef.current.clearLayers();

        markers.forEach((markerData) => {
          if (markerData.lat == null || markerData.lng == null) return;

          const imageHtml = markerData.latestImage
            ? `<img src="${markerData.latestImage}" class="w-full h-full object-cover" />`
            : `<div class="w-3 h-3 bg-white rounded-full"></div>`;

          const isSelected = selectedLocation?.id === markerData.id;
          const outlineColor = isSelected ? '#ef4444' : '#ffffff';
          const outlineWidth = isSelected ? '4px' : '2px';
          const selectedGlow = isSelected
            ? '0 0 0 3px rgba(239,68,68,0.28), 0 4px 12px rgba(0,0,0,0.32)'
            : '0 4px 10px rgba(0,0,0,0.28)';

          const iconHtml = `
            <div class="relative transition-transform hover:scale-110 cursor-pointer">
              <div class="w-10 h-10 rounded-full shadow-lg overflow-hidden bg-blue-500 flex items-center justify-center" style="border:${outlineWidth} solid ${outlineColor};box-shadow:${selectedGlow};">
                ${imageHtml}
              </div>
              <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px]" style="border-top-color:${outlineColor};"></div>
            </div>
          `;

          const customIcon = L.divIcon({
            className: 'custom-pin',
            html: iconHtml,
            iconSize: [40, 50],
            iconAnchor: [20, 50],
          });

          const marker = L.marker([markerData.lat, markerData.lng], { icon: customIcon })
            .on('click', (e) => {
              L.DomEvent.stopPropagation(e);
              setTimeout(() => {
                openPinPanel(markerData);
                if (tempMarkerRef.current) {
                  tempMarkerRef.current.remove();
                  tempMarkerRef.current = null;
                }
              }, 10);
            });

          markersLayerRef.current.addLayer(marker);
        });
      }, [markers, tempCoords, comment, selectedImage, selectedFile, selectedLocation]);

      useEffect(() => {
        if (!mapInstanceRef.current) return;

        if (tempCoords) {
          if (tempMarkerRef.current) tempMarkerRef.current.remove();
          tempMarkerRef.current = L.marker([tempCoords.lat, tempCoords.lng], { opacity: 0.6 }).addTo(mapInstanceRef.current);
        } else if (tempMarkerRef.current) {
          tempMarkerRef.current.remove();
          tempMarkerRef.current = null;
        }
      }, [tempCoords]);

      useEffect(() => {
        return () => {
          if (locationWatchIdRef.current != null && navigator.geolocation) {
            navigator.geolocation.clearWatch(locationWatchIdRef.current);
          }
        };
      }, []);

      const handleMapClick = (latlng) => {
        if (showPanel && selectedLocation) {
          setSelectedLocation(null);
          setShowPanel(false);
          return;
        }

        setSelectedLocation(null);
        setTempCoords(latlng);
        setIsAddingMode(true);
        setShowPanel(true);
      };

      const handleImageSelect = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (previewUrlRef.current) {
          URL.revokeObjectURL(previewUrlRef.current);
        }

        const previewUrl = URL.createObjectURL(file);
        previewUrlRef.current = previewUrl;

        setSelectedImage(previewUrl);
        setSelectedFile(file);
      };

      const VERIFY_ACCESS_URL = 'https://wgwlnutnstrfuiiunlcu.supabase.co/functions/v1/hyper-responder';
      const ACCESS_APP_NAME = 'Landsign';

      async function verifyDeleteAccess() {
        const accessCode = window.prompt('Enter access code to continue:');
        if (accessCode === null) return false;

        const cleanCode = accessCode.trim();
        if (!cleanCode) {
          alert('Please enter an access code.');
          return false;
        }

        try {
          const response = await fetch(VERIFY_ACCESS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              app: ACCESS_APP_NAME,
              code: cleanCode,
            }),
          });

          let result = null;
          try {
            result = await response.json();
          } catch (_) {
            result = null;
          }

          if (!response.ok || result?.valid !== true) {
            alert(result?.message || result?.error || 'Access denied.');
            return false;
          }

          return true;
        } catch (error) {
          console.error('Access-code verification failed:', error);
          alert('Unable to verify the access code. Please check your connection and try again.');
          return false;
        }
      }

      const handleDelete = async (e) => {
        if (e) {
          e.preventDefault();
          e.nativeEvent.stopImmediatePropagation();
          e.stopPropagation();
        }

        if (!selectedLocation) return;
        if (!(await verifyDeleteAccess())) return;
        if (!confirm('Are you sure you want to delete this pin?')) return;

        const imageUrls = [];
        if (selectedLocation.latestImage) imageUrls.push(selectedLocation.latestImage);

        if (selectedLocation.history && selectedLocation.history.length > 0) {
          selectedLocation.history.forEach((entry) => {
            if (entry.image) imageUrls.push(entry.image);
          });
        }

        const filePaths = [...new Set(imageUrls.map((url) => extractStoragePathFromUrl(url)).filter(Boolean))];

        if (filePaths.length > 0) {
          const { error: storageError } = await sb.storage.from(IMAGE_BUCKET).remove(filePaths);
          if (storageError) {
            console.error('Failed to delete storage files:', storageError);
            alert('Failed to delete storage images: ' + storageError.message);
            return;
          }
        }

        const newMarkers = markers.filter((m) => m.id !== selectedLocation.id);
        setMarkers(newMarkers);
        await saveSharedData(newMarkers);
        setSelectedLocation(null);
        setShowPanel(false);
      };

      const handleDeleteHistoryEntry = async (entryIndex, e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          e.nativeEvent?.stopImmediatePropagation?.();
        }

        if (!selectedLocation || !Array.isArray(selectedLocation.history)) return;

        const entryToDelete = selectedLocation.history[entryIndex];
        if (!entryToDelete) return;
        if (!(await verifyDeleteAccess())) return;
        if (!confirm('Are you sure you want to delete this note/photo?')) return;

        const filePath = extractStoragePathFromUrl(entryToDelete.image);
        if (filePath) {
          const { error: storageError } = await sb.storage.from(IMAGE_BUCKET).remove([filePath]);
          if (storageError) {
            console.error('Failed to delete storage file:', storageError);
            alert('Failed to delete image: ' + storageError.message);
            return;
          }
        }

        let newMarkers = markers
          .map((m) => {
            if (m.id !== selectedLocation.id) return m;

            const nextHistory = (m.history || []).filter((_, idx) => idx !== entryIndex);

            if (nextHistory.length === 0) {
              return null;
            }

            return rebuildMarkerAfterHistoryChange(m, nextHistory);
          })
          .filter(Boolean);

        newMarkers = normalizeMarkers(newMarkers);

        setMarkers(newMarkers);
        await saveSharedData(newMarkers);

        const updatedSelected = newMarkers.find((m) => m.id === selectedLocation.id) || null;
        setSelectedLocation(updatedSelected);

        if (!updatedSelected) {
          setShowPanel(false);
        }
      };

      const handleSubmit = async (e) => {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }

        if (!comment && !selectedImage && !selectedFile) return;

        if (selectedImage && !selectedFile) {
          alert('Image is still being prepared. Please wait about 1 second and try again.');
          return;
        }

        setIsUploading(true);
        let uploadedImageUrl = null;

        if (selectedFile) {
          const uploadedImagePath = await uploadImageToStorage(selectedFile);
          if (!uploadedImagePath) {
            setIsUploading(false);
            return;
          }
          const {data:signed,error:signError}=await sb.storage.from(IMAGE_BUCKET).createSignedUrl(uploadedImagePath,IMAGE_TTL);
          if(signError){alert('Image uploaded but private preview failed: '+signError.message);setIsUploading(false);return;}
          uploadedImageUrl=absoluteSupabaseUrl(signed?.signedUrl);
        }

        const newEntry = {
          comment,
          image: uploadedImageUrl,
          timestamp: new Date().toISOString(),
          author: 'Me',
        };

        let newMarkers = [...markers];

        if (selectedLocation) {
          newMarkers = newMarkers.map((m) => {
            if (m.id === selectedLocation.id) {
              return {
                ...m,
                latestImage: uploadedImageUrl || m.latestImage,
                latestComment: comment || m.latestComment,
                updatedAt: new Date().toISOString(),
                history: [...(m.history || []), newEntry],
              };
            }
            return m;
          });

          setSelectedLocation(null);
        } else if (tempCoords) {
          const newMarker = {
            id: Date.now().toString(),
            lat: tempCoords.lat,
            lng: tempCoords.lng,
            latestImage: uploadedImageUrl,
            latestComment: comment,
            createdAt: new Date().toISOString(),
            history: [newEntry],
          };

          newMarkers.push(newMarker);
          setTempCoords(null);
          setIsAddingMode(false);
        }

        setMarkers(newMarkers);
        await saveSharedData(newMarkers);

        if (previewUrlRef.current) {
          URL.revokeObjectURL(previewUrlRef.current);
          previewUrlRef.current = null;
        }

        setComment('');
        setSelectedImage(null);
        setSelectedFile(null);
        setDraftState(null);
        setShowPanel(false);
        setIsUploading(false);
      };

      const handleExport = () => {
        const dataStr = JSON.stringify(markers);
        navigator.clipboard.writeText(dataStr)
          .then(() => {
            setCopySuccess(true);
            setTimeout(() => setCopySuccess(false), 2000);
          })
          .catch(() => {
            alert('Copy failed. Please select all and copy manually.\n\n' + dataStr);
          });
      };

      const handleImport = async () => {
        try {
          if (!importText) return;
          const parsedPersistent = normalizeMarkers(JSON.parse(importText));
          const parsed = await signMarkers(parsedPersistent);
          if (!Array.isArray(parsed)) {
            alert('Invalid data format.');
            return;
          }

          if (confirm('Would you like to add this to the existing data? (Cancel = replace all)')) {
            const currentIds = new Set(markers.map((m) => m.id));
            const merged = [...markers];
            parsed.forEach((m) => {
              if (!currentIds.has(m.id)) merged.push(m);
            });
            setMarkers(merged);
            await saveSharedData(merged);
          } else {
            setMarkers(parsed);
            await saveSharedData(parsed);
          }

          setImportText('');
          alert('Import successful! (' + parsed.length + ' pins)');
        } catch (e) {
          alert('Data format error: ' + e.message);
        }
      };

      return (
        <div className="relative w-full h-full font-sans text-gray-800">
          <div id="map-container" ref={mapRef} className="absolute inset-0 z-0"></div>

          <div className="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none ui-layer">
            <div className="bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg pointer-events-auto flex items-center gap-2 ui-content">
              <Icons.MapPin size={18} className="text-blue-600" />
              <span className="font-bold text-sm">HM Signs</span>
              <span className="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full">
                {markers.length} pins
              </span>
            </div>
          
            <div className="map-action-buttons pointer-events-auto ui-content">
              <button
                onClick={handleLocateMe}
                className="map-action-btn location"
                title="My location"
                aria-label="My location"
              >
                {isLocating ? (
                  <div className="map-action-spinner"></div>
                ) : (
                  <Icons.Locate className="map-action-icon" />
                )}
              </button>

              <button
                onClick={() => setShowSettings(true)}
                className="map-action-btn settings"
                title="Settings"
                aria-label="Settings"
              >
                <Icons.Settings className="map-action-icon" />
              </button>
              <button
                type="button"
                onClick={async () => {
                  const { error } = await sb.auth.signOut();
                  if (error) console.error('Sign-out error:', error);
                }}
                className="sign-out-btn"
                title="Sign out"
                aria-label="Sign out"
              >
                Sign out
              </button>
            </div>
          </div>

          {locationError && (
            <div className="absolute top-20 left-4 right-4 z-20 pointer-events-none ui-layer">
              <div className="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-2 rounded-xl shadow">
                {locationError}
              </div>
            </div>
          )}

          {myLocation && !locationError && (
            <div className="absolute top-20 left-4 z-20 pointer-events-none ui-layer">
              <div className="bg-white/90 backdrop-blur-sm text-xs text-gray-600 px-3 py-2 rounded-full shadow">
                Location accuracy: about {Math.round(myLocation.accuracy || 0)}m
              </div>
            </div>
          )}

          {showSettings && (
            <div className="absolute inset-0 bg-black/50 z-[9999] flex items-center justify-center p-4 ui-layer ui-content">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl modal-enter">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold text-gray-800">Data Sharing / Status</h2>
                  <button onClick={() => setShowSettings(false)} className="p-1 hover:bg-gray-100 rounded-full">
                    <Icons.X size={24} />
                  </button>
                </div>

                <div className="space-y-6">
                  <div className="text-xs text-gray-500 bg-gray-50 rounded-lg p-3 border">
                    Status: {syncMessage}
                  </div>

                  <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 className="font-bold text-blue-800 mb-1 flex items-center gap-2">
                      <Icons.Upload size={18} /> Export (Backup)
                    </h3>
                    <p className="text-xs text-blue-600 mb-3">Copy all current map data as text.</p>

                    <button
                      onClick={handleExport}
                      className={`w-full py-2.5 rounded-lg font-bold text-sm transition flex items-center justify-center gap-2 ${copySuccess ? 'bg-green-500 text-white' : 'bg-blue-600 text-white hover:bg-blue-700'}`}
                    >
                      {copySuccess ? (
                        <>
                          <Icons.Check size={16} /> Copied!
                        </>
                      ) : (
                        'Copy data code'
                      )}
                    </button>
                  </div>

                  <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <h3 className="font-bold text-gray-800 mb-1 flex items-center gap-2">
                      <Icons.Download size={18} /> Import
                    </h3>
                    <p className="text-xs text-gray-500 mb-3">Paste your backup code below.</p>

                    <textarea
                      value={importText}
                      onChange={(e) => setImportText(e.target.value)}
                      className="w-full h-20 p-2 border rounded-lg text-xs mb-2 focus:ring-2 focus:ring-blue-500 outline-none"
                      placeholder='[{"id":"170..." ...}]'
                    />

                    <button
                      onClick={handleImport}
                      disabled={!importText}
                      className="w-full bg-gray-800 text-white py-2.5 rounded-lg font-bold text-sm hover:bg-black disabled:bg-gray-300 transition"
                    >
                      Add to map
                    </button>
                  </div>

                  <div className="text-center text-xs text-gray-400">Pin count: {markers.length}</div>
                </div>
              </div>
            </div>
          )}

          {showPanel && (selectedLocation || isAddingMode) && (
            <div
              className="absolute bottom-0 left-0 right-0 sm:top-0 sm:right-0 sm:bottom-0 sm:left-auto sm:w-96 bg-white z-[5000] shadow-2xl sm:border-l border-gray-200 flex flex-col slide-up max-h-[85vh] sm:max-h-screen rounded-t-2xl sm:rounded-none ui-layer ui-content"
              onClick={(e) => e.nativeEvent.stopImmediatePropagation()}
              onMouseDown={(e) => e.nativeEvent.stopImmediatePropagation()}
              onTouchStart={(e) => e.nativeEvent.stopImmediatePropagation()}
            >
              <div className="flex items-center justify-between p-4 border-b border-gray-100 sticky top-0 bg-white rounded-t-2xl z-10">
                {isAddingMode ? <h2 className="text-lg font-bold">New place</h2> : <div aria-hidden="true"></div>}

                <div className="flex gap-2 items-center">
                  {selectedLocation && !isAddingMode && (
                    <button
                      onClick={handleDelete}
                      className="flex items-center gap-1 px-3 py-1.5 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition text-sm font-bold shadow-sm border border-red-100 cursor-pointer"
                    >
                      <Icons.Trash size={16} /> Delete
                    </button>
                  )}

                  <button
                    onClick={handleBackToMap}
                    className="px-3 py-1.5 text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition text-sm font-bold shadow-sm border border-blue-100 cursor-pointer"
                  >
                    Back to map
                  </button>

                  <button
                    onClick={handleClosePanel}
                    className="p-2 hover:bg-gray-100 rounded-full cursor-pointer"
                    title="Close and clear"
                    aria-label="Close and clear"
                  >
                    <Icons.X size={20} />
                  </button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {selectedLocation && (
                  <div className="space-y-6">
                    {selectedLocation.history && selectedLocation.history.length > 0 ? (
                      [...selectedLocation.history]
                        .map((entry, originalIndex) => ({ entry, originalIndex }))
                        .sort((a, b) => new Date(b.entry.timestamp || 0) - new Date(a.entry.timestamp || 0))
                        .map(({ entry, originalIndex }) => {
                        const entryDate = new Date(entry.timestamp).toLocaleDateString('en-US', {
                          year: 'numeric',
                          month: 'short',
                          day: 'numeric',
                        });

                        return (
                          <div key={originalIndex} className="relative pl-6 pb-6 border-l-2 border-gray-200 last:border-0 last:pb-0">
                            <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-blue-500 border-2 border-white shadow-sm"></div>

                            <div className="flex items-center justify-between mb-1 gap-2">
                              <div className="text-xs text-gray-400 flex items-center gap-1">
                                <Icons.Clock className="w-3 h-3 shrink-0" />
                                <span>{entryDate}</span>
                              </div>

                              <button
                                type="button"
                                onClick={(e) => handleDeleteHistoryEntry(originalIndex, e)}
                                className="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-md border border-red-100"
                                title="Delete this note/photo"
                                aria-label="Delete this note/photo"
                              >
                                <Icons.Trash size={12} />
                                Delete
                              </button>
                            </div>

                            <div className="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                              {entry.image && (
                                <button
                                  type="button"
                                  onClick={() => openLightbox(entry.image, entry.comment, entryDate)}
                                  className="group relative block w-full text-left cursor-zoom-in"
                                >
                                  <img src={entry.image} className="w-full h-48 object-cover" alt="Memory" />
                                  <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition flex items-center justify-center">
                                    <div className="opacity-0 group-hover:opacity-100 transition bg-white/90 text-gray-800 rounded-full px-3 py-1.5 text-xs font-semibold flex items-center gap-1 shadow">
                                      <Icons.ZoomIn size={14} /> View larger
                                    </div>
                                  </div>
                                </button>
                              )}
                              {entry.comment && <div className="p-3 text-sm text-gray-700">{entry.comment}</div>}
                            </div>
                          </div>
                        );
                      })
                    ) : (
                      <p className="text-center text-gray-400 py-10">No records</p>
                    )}
                  </div>
                )}

                {isAddingMode && <div className="text-center py-10 text-gray-400">Leave a photo and a note.</div>}
              </div>

              <div className="p-4 bg-gray-50 border-t border-gray-200 sticky bottom-0 z-50 bg-white">
                {selectedImage && (
                  <div className="mb-2 relative inline-block group">
                    <button
                      type="button"
                      onClick={() => openLightbox(selectedImage, comment || 'Preview image', 'Preview')}
                      className="block cursor-zoom-in"
                    >
                      <img src={selectedImage} className="h-16 w-auto rounded border" alt="Selected preview" />
                      <div className="absolute inset-0 rounded border bg-black/0 group-hover:bg-black/20 transition flex items-center justify-center">
                        <div className="opacity-0 group-hover:opacity-100 transition bg-white/90 text-gray-800 rounded-full px-2.5 py-1 text-[11px] font-semibold flex items-center gap-1 shadow">
                          <Icons.ZoomIn size={12} /> Enlarge
                        </div>
                      </div>
                    </button>
                    <button
                      onClick={() => {
                        if (selectedImage && selectedImage.startsWith('blob:')) {
                          URL.revokeObjectURL(selectedImage);
                          if (previewUrlRef.current === selectedImage) {
                            previewUrlRef.current = null;
                          }
                        }
                        setSelectedImage(null);
                        setSelectedFile(null);
                      }}
                      className="absolute -top-2 -right-2 bg-black text-white rounded-full p-0.5"
                    >
                      <Icons.X size={12} />
                    </button>
                  </div>
                )}

                <div className="flex items-center gap-2 w-full">
                  <label className="shrink-0 w-10 h-10 flex items-center justify-center bg-white text-blue-600 rounded-xl border cursor-pointer hover:bg-blue-50 transition shadow-sm">
                    <Icons.Camera size={20} />
                    <input type="file" accept="image/*" className="hidden" onChange={handleImageSelect} />
                  </label>

                  <input
                    type="text"
                    value={comment}
                    onChange={(e) => setComment(e.target.value)}
                    placeholder="Add a note..."
                    className="flex-1 h-10 pl-3 pr-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm outline-none min-w-0"
                  />

                  <button
                    onClick={handleSubmit}
                    disabled={isUploading}
                    className="shrink-0 w-10 h-10 flex items-center justify-center bg-blue-600 text-white rounded-xl shadow-md hover:bg-blue-700 disabled:bg-gray-300 transition"
                  >
                    <Icons.Send size={18} />
                  </button>
                </div>
              </div>
            </div>
          )}

          {!showPanel && (selectedLocation || draftState) && (
            <div className="absolute bottom-4 left-4 right-4 z-[7000] flex flex-col sm:flex-row gap-2 pointer-events-none ui-layer">
              <div className="flex flex-col sm:flex-row gap-2 pointer-events-auto ui-content">
                {draftState && (
                  <button
                    type="button"
                    onClick={restoreDraft}
                    className="bg-blue-600 text-white px-4 py-3 rounded-2xl shadow-lg hover:bg-blue-700 transition font-semibold text-sm"
                  >
                    Return to draft
                  </button>
                )}

                {selectedLocation && (
                  <button
                    type="button"
                    onClick={() => setShowPanel(true)}
                    className="bg-white/95 backdrop-blur-sm text-gray-800 px-4 py-3 rounded-2xl shadow-lg hover:bg-gray-100 transition font-semibold text-sm border"
                  >
                    Back to pin
                  </button>
                )}

                <button
                  type="button"
                  onClick={() => {
                    setSelectedLocation(null);
                    setDraftState(null);
                  }}
                  className="bg-white/95 backdrop-blur-sm text-gray-600 px-4 py-3 rounded-2xl shadow-lg hover:bg-gray-100 transition font-semibold text-sm border"
                >
                  Clear hidden screen
                </button>
              </div>
            </div>
          )}

          {lightboxImage && (
            <div
              className="absolute inset-0 z-[12000] bg-black/85 flex items-center justify-center p-4 sm:p-6 ui-content"
              onClick={closeLightbox}
            >
              <div className="relative w-full h-full flex flex-col items-center justify-center" onClick={(e) => e.stopPropagation()}>
                <button
                  type="button"
                  onClick={closeLightbox}
                  className="lightbox-close-btn"
                  aria-label="Close enlarged image"
                  title="Close"
                >
                  <Icons.X className="lightbox-close-icon" />
                </button>

                <div
                  className="flex-1 w-full flex items-center justify-center overflow-hidden"
                  onWheel={handleLightboxWheel}
                  onDoubleClick={toggleLightboxZoom}
                  onPointerDown={handleLightboxPointerDown}
                  onPointerMove={handleLightboxPointerMove}
                  onPointerUp={handleLightboxPointerUp}
                  onPointerCancel={handleLightboxPointerUp}
                  onPointerLeave={handleLightboxPointerUp}
                  style={{ touchAction: lightboxZoom > 1 ? 'none' : 'auto' }}
                >
                  <img
                    src={lightboxImage}
                    alt="Enlarged view"
                    className="lightbox-image modal-enter"
                    draggable="false"
                    style={{
                      transform: `translate(${lightboxOffset.x}px, ${lightboxOffset.y}px) scale(${lightboxZoom})`,
                      transition: lightboxPointerIdRef.current ? 'none' : 'transform 0.2s ease',
                      cursor: lightboxZoom > 1 ? 'grab' : 'zoom-in',
                      userSelect: 'none',
                    }}
                  />
                </div>

                {(lightboxCaption || lightboxDate) && (
                  <div className="mt-4 max-w-3xl w-full bg-white/10 backdrop-blur-sm text-white rounded-2xl px-4 py-3 shadow-lg">
                    {lightboxDate && <div className="text-xs text-white/70 mb-1">{lightboxDate}</div>}
                    {lightboxCaption && <div className="text-sm sm:text-base">{lightboxCaption}</div>}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function AuthenticatedApp() {
      const [session, setSession] = useState(null);
      const [checking, setChecking] = useState(true);
      const [email, setEmail] = useState('');
      const [otp, setOtp] = useState('');
      const [step, setStep] = useState('email');
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState('');

      useEffect(() => {
        let mounted = true;
        async function checkSession() {
          const { data, error } = await sb.auth.getSession();
          if (!mounted) return;
          if (error) console.error('Session check error:', error);
          setSession(data?.session || null);
          setChecking(false);
        }
        checkSession();
        const { data: listener } = sb.auth.onAuthStateChange((event, nextSession) => {
          if (!mounted) return;
          setSession(nextSession || null);
          setChecking(false);
          if (event === 'SIGNED_OUT') {
            setStep('email');
            setOtp('');
            setMessage('');
          }
        });
        return () => {
          mounted = false;
          listener?.subscription?.unsubscribe();
        };
      }, []);

      async function sendEmailOtp(event) {
        event?.preventDefault();
        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail) {
          setMessage('Please enter your registered email address.');
          return;
        }
        setBusy(true);
        setMessage('Sending verification code...');
        const { error } = await sb.auth.signInWithOtp({
          email: cleanEmail,
          options: { shouldCreateUser: false },
        });
        setBusy(false);
        if (error) {
          console.error('Email OTP error:', error);
          setMessage('The verification code could not be sent. Check the email address and try again.');
          return;
        }
        setEmail(cleanEmail);
        setStep('otp');
        setMessage('An 8-digit verification code has been sent to your email.');
      }

      async function verifyEmailOtp(event) {
        event?.preventDefault();
        const cleanOtp = otp.replace(/\D/g, '').slice(0, 8);
        if (!/^\d{8}$/.test(cleanOtp)) {
          setMessage('Please enter the 8-digit verification code.');
          return;
        }
        setBusy(true);
        setMessage('Verifying code...');
        const { data, error } = await sb.auth.verifyOtp({
          email: email.trim().toLowerCase(),
          token: cleanOtp,
          type: 'email',
        });
        setBusy(false);
        if (error || !data?.session) {
          console.error('OTP verification error:', error);
          setMessage('The code is incorrect or has expired. Request a new code and try again.');
          return;
        }
        setSession(data.session);
        setOtp('');
        setMessage('');
      }

      function changeEmail() {
        if (busy) return;
        setStep('email');
        setOtp('');
        setMessage('');
      }

      if (checking) {
        return (
          <div className="auth-screen" aria-live="polite">
            <div className="auth-spinner" aria-label="Checking access"></div>
          </div>
        );
      }

      if (!session) {
        return (
          <div className="auth-screen">
            <form className="auth-card" onSubmit={step === 'email' ? sendEmailOtp : verifyEmailOtp}>
              <div className="text-xs font-bold tracking-widest uppercase text-teal-300 mb-3">Operations Monitoring</div>
              <h1 className="text-2xl font-bold text-white mb-2">HM Signs access</h1>
              {step === 'email' ? (
                <>
                  <p className="text-sm text-slate-300 mb-6">Enter your registered email address to receive an 8-digit verification code.</p>
                  <label htmlFor="authEmail" className="block text-sm font-semibold text-slate-100">Email address</label>
                  <input id="authEmail" className="auth-input" type="email" autoComplete="email" value={email} onChange={(event) => setEmail(event.target.value)} placeholder="name@example.com" disabled={busy} required />
                  <button className="auth-button" type="submit" disabled={busy}>{busy ? 'Sending...' : 'Send verification code'}</button>
                </>
              ) : (
                <>
                  <p className="text-sm text-slate-300 mb-2">Enter the 8-digit code sent to:</p>
                  <p className="text-sm font-semibold text-teal-200 mb-6 break-all">{email}</p>
                  <label htmlFor="authOtp" className="block text-sm font-semibold text-slate-100">Verification code</label>
                  <input id="authOtp" className="auth-input text-center text-2xl tracking-[0.35em] font-bold" type="text" inputMode="numeric" autoComplete="one-time-code" value={otp} onChange={(event) => setOtp(event.target.value.replace(/\D/g, '').slice(0, 8))} placeholder="00000000" maxLength="8" disabled={busy} autoFocus required />
                  <button className="auth-button" type="submit" disabled={busy || otp.length !== 8}>{busy ? 'Verifying...' : 'Verify and sign in'}</button>
                  <button type="button" onClick={sendEmailOtp} disabled={busy} className="w-full mt-3 py-2.5 rounded-lg border border-slate-500 text-slate-100 text-sm font-semibold hover:bg-white/10 disabled:opacity-50">Resend code</button>
                  <button type="button" onClick={changeEmail} disabled={busy} className="w-full mt-2 py-2 text-slate-300 text-sm hover:text-white disabled:opacity-50">Use a different email address</button>
                </>
              )}
              <p className="min-h-[24px] mt-4 text-sm text-slate-200" role="status">{message}</p>
            </form>
          </div>
        );
      }
      return <MainApp />;
    }
    const reactRoot = ReactDOM.createRoot(document.getElementById('root'));
    reactRoot.render(<AuthenticatedApp />);
  </script>
</body>
</html>
